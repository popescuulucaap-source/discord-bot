name: Bot smoke checks

on:
  push:
    branches: [main]
    paths:
      - "archive-2026-10-04T205709Z/main.py"
      - "archive-2026-10-04T205709Z/requirements.txt"
      - ".github/workflows/bot-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "archive-2026-10-04T205709Z/main.py"
      - "archive-2026-10-04T205709Z/requirements.txt"
      - ".github/workflows/bot-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r archive-2026-10-04T205709Z/requirements.txt
      - name: Compile bot source
        run: python -m py_compile archive-2026-10-04T205709Z/main.py
      - name: Import bot and verify core commands register
        env:
          DISCORD_TOKEN: smoke-test-token-not-used
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          source = Path("archive-2026-10-04T205709Z/main.py")
          spec = importlib.util.spec_from_file_location("gargand_bot_smoke_test", source)
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not load Gargand bot module")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          required = {"setup", "report", "antispam", "kick", "warn"}
          missing = sorted(name for name in required if module.bot.get_command(name) is None)
          if missing:
              raise AssertionError(f"Expected bot commands failed to register: {missing}")

          print(f"Import succeeded; {len(module.bot.commands)} prefix commands registered.")
          print("Core command registration passed: " + ", ".join(sorted(required)))
          PY
