name: Bot smoke checks

on:
  push:
    branches: [main]
    paths:
      - "archive-2026-10-04T205709Z/main.py"
      - "archive-2026-10-04T205709Z/requirements.txt"
      - "start_nightfall.py"
      - "nightfall_upgrades.py"
      - "gargand_features.py"
      - "gargand_music.py"
      - ".github/workflows/bot-syntax.yml"
  pull_request:
    branches: [main]
    paths:
      - "archive-2026-10-04T205709Z/main.py"
      - "archive-2026-10-04T205709Z/requirements.txt"
      - "start_nightfall.py"
      - "nightfall_upgrades.py"
      - "gargand_features.py"
      - ".github/workflows/bot-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r archive-2026-10-04T205709Z/requirements.txt
      - name: Compile all bot modules
        run: python -m py_compile archive-2026-10-04T205709Z/main.py nightfall_upgrades.py gargand_features.py start_nightfall.py
      - name: Import bot and verify core plus feature commands
        env:
          DISCORD_TOKEN: smoke-test-token-not-used
          BOT_DB: /tmp/gargand-smoke.sqlite3
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root))
          source = root / "archive-2026-10-04T205709Z" / "main.py"
          spec = importlib.util.spec_from_file_location("gargand_bot_smoke_test", source)
          if spec is None or spec.loader is None:
              raise RuntimeError("Could not load Gargand bot module")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          import nightfall_upgrades
          import gargand_features
          import gargand_music
          import asyncio

          async def register_extensions():
              nightfall_upgrades.install(module)
              gargand_features.install(module)
              gargand_music.install(module)

          asyncio.run(register_extensions())

          required = {
              "setup", "report", "antispam", "kick", "warn",
              "achievements", "quest", "season", "seasonleaderboard",
              "globalleaderboard", "party", "image", "rss",
              "animewatch", "animeunwatch", "animewatches", "auditlog",
              "leaderboard", "play", "skip", "pause", "resume", "stop",
              "queue", "nowplaying", "volume", "leave",
          }
          missing = sorted(name for name in required if module.bot.get_command(name) is None)
          if missing:
              raise AssertionError(f"Expected bot commands failed to register: {missing}")

          print(f"Import succeeded; {len(module.bot.commands)} prefix commands registered.")
          print("Core and feature command registration passed: " + ", ".join(sorted(required)))
          PY
